<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon (iOS and the store listing). Full bleed and opaque: iOS masks the corners itself and rejects transparency. q-colour.png is the legacy QadraHR app's icon (qadra-mobile/assets/images/icon.png, 1024 px): the colour Q on white, with its off-white background evened out to pure white. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <image href="q-colour.png" xlink:href="q-colour.png" x="0" y="0" width="1024" height="1024"/>
</svg>
