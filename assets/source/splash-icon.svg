<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Splash mark, on the page colour set in app.config.ts: the colour Q on a white rounded tile, so it reads on both the light and the dark splash background. -->
  <defs><clipPath id="tile"><rect x="192" y="192" width="640" height="640" rx="160"/></clipPath></defs>
  <rect x="192" y="192" width="640" height="640" rx="160" fill="#FFFFFF"/>
  <image href="q-colour.png" xlink:href="q-colour.png" x="192" y="192" width="640" height="640" clip-path="url(#tile)"/>
</svg>
